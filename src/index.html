<!doctype html>
<html lang="pt-AO" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>Conto Contigo · Eventos e convites</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Conto Contigo — cria eventos, envia convites individuais e acompanha as respostas num só lugar."
    />
    <meta name="theme-color" content="#0A1211" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Aplica o tema antes do arranque do Angular para evitar um flash.
      // Segue `prefers-color-scheme` por omissão e respeita a escolha guardada.
      (function () {
        try {
          var stored = localStorage.getItem('contacomigo.theme');
          var mode =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var dark =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
              : mode === 'dark';
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.classList.toggle('light', !dark);
        } catch (error) {
          /* storage indisponível: mantém o tema por omissão */
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="assets/conta-comigo-icone.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
