<!doctype html>
<html lang="pt-PT" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>Conto Contigo · Eventos e convites</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Conto Contigo — cria eventos, envia convites individuais e acompanha as respostas num só lugar."
    />
    <meta name="theme-color" content="#0F3D3E" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Aplica o tema antes do arranque do Angular para evitar um flash.
      // Segue `prefers-color-scheme` por omissão e respeita a escolha guardada.
      (function () {
        try {
          var stored = localStorage.getItem('contacomigo.theme');
          var mode =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var dark =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
              : mode === 'dark';
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.classList.toggle('light', !dark);
        } catch (error) {
          /* storage indisponível: mantém o tema por omissão */
        }
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:site_name" content="Conto Contigo" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Conto Contigo · Eventos e convites" />
    <meta
      property="og:description"
      content="Cria eventos, envia convites individuais e acompanha as respostas num só lugar."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="preload" href="/fonts/Figtree-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Figtree-800.woff2" as="font" type="font/woff2" crossorigin />
  </head>

</html>
