<div class="relative min-h-dvh overflow-hidden">
  <div class="mx-auto flex min-h-dvh w-full max-w-4xl flex-col px-4 py-5 sm:px-6 lg:py-8">
    <header class="flex flex-wrap items-center justify-between gap-3">
      <app-brand />
      <app-preference-controls class="hidden sm:flex" />
    </header>

    <main class="flex flex-1 items-center justify-center py-10">
      <article
        class="w-full max-w-lg rounded-4xl border border-line bg-surface p-6 text-center shadow-card backdrop-blur-2xl animate-rise sm:p-8"
      >
        <p class="font-display text-5xl font-semibold tracking-tight text-brand-strong sm:text-6xl">
          404
        </p>
        <span
          class="mx-auto mt-4 grid size-14 place-items-center rounded-2xl border border-amber/30 bg-amber/15 text-amber"
        >
          <fa-icon [icon]="icons['warning']" class="text-lg" aria-hidden="true" />
        </span>
        <h1 class="mt-4 font-display text-xl font-semibold tracking-tight text-ink">
          {{ i18n.t('notFound.title') }}
        </h1>
        <p class="mt-2 text-sm leading-6 text-muted">{{ i18n.t('notFound.text') }}</p>

        <a
          routerLink="/painel"
          class="mt-5 inline-flex h-11 items-center justify-center gap-2 rounded-xl bg-brand hover:bg-secondary-hover px-4 text-sm font-semibold text-on-secondary transition"
        >
          <fa-icon [icon]="icons['chevronLeft']" class="text-xs" aria-hidden="true" />
          {{ i18n.t('notFound.back') }}
        </a>
      </article>
    </main>

    <footer class="flex flex-wrap items-center justify-between gap-2 text-[10px] text-muted/70">
      <p>{{ i18n.t('footer.rights', { year: 2026 }) }}</p>
      <span>{{ i18n.t('footer.made') }}</span>
    </footer>
  </div>
</div>
