<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 120" width="410" height="120" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Conta Comigo</title>
  <desc id="d">Dois círculos que se sobrepõem, com um visto na zona comum, ao lado do nome Conta Comigo.</desc>
  <defs>
    <clipPath id="ringA"><circle cx="46" cy="60" r="28"/></clipPath>
  </defs>

  <!-- Ícone: duas pessoas (dois círculos) e o visto da confirmação no meio -->
