<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gratitude — Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,400;0,500;0,700;0,800;1,800&display=swap" rel="stylesheet">

<style>
:root{--bg:#efe9dc;--surface:#fff;--ink:#1d1a16;--muted:#6b6253;--line:#d9d0bd;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201e;--surface:#1c2b29;--ink:#f3eee2;--muted:#a9b3ad;--line:#2f433f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14201e;--surface:#1c2b29;--ink:#f3eee2;--muted:#a9b3ad;--line:#2f433f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;padding:16px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:16px}

/* ===== POSTER 4:5 — tudo escala com cqw ===== */
.poster{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;container-type:inline-size;
 background:radial-gradient(circle at 50% 45%,#fffdf8 0%,#fff6ea 55%,#fbe9cf 100%);
 border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);color:#1a1a1a}
.poster svg.deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.logo{position:absolute;top:2.4%;left:50%;transform:translateX(-50%);width:19%;aspect-ratio:1;border-radius:50%;overflow:hidden;display:grid;place-items:center}
.logo img{width:100%;height:100%;object-fit:cover;display:none}
.logo.has img{display:block}.logo.has svg{display:none}
.logo svg{width:100%;height:100%}
.org{position:absolute;top:19.4%;left:0;right:0;text-align:center;font-weight:500;font-size:2.7cqw;letter-spacing:.27em;text-transform:uppercase;padding-left:.27em}
.sub{position:absolute;top:22.4%;left:0;right:0;text-align:center;font-weight:800;font-size:4.7cqw;text-transform:uppercase;letter-spacing:.01em}
.title{position:absolute;left:4.5%;width:91%;height:20.7%;top:28.6%;overflow:visible}
.year{position:absolute;top:49.8%;left:0;right:0;text-align:center;font-family:Montserrat,sans-serif;font-style:italic;font-weight:800;font-size:9.6cqw;color:#b3121a;line-height:1.15;letter-spacing:-.01em;transform:skewX(-4deg)}
.info{position:absolute;left:4cqw;right:4cqw;top:62.9%;display:flex;align-items:center;justify-content:space-between}
.c{display:flex;align-items:center;gap:1.4cqw;padding:0 2cqw;min-height:11cqw}
.c+.c{border-left:.45cqw solid #d4a017}
.c:first-child{padding-left:0}
.c svg{width:5.4cqw;height:5.4cqw;flex:none}
.c .v{font-weight:400;font-size:3.7cqw;letter-spacing:.1em;white-space:nowrap}
.c.loc{flex:none}
.c.loc .t{font-weight:800;font-size:2.55cqw;line-height:1.2;white-space:nowrap}
.c.loc .t b{display:block;font-size:2.2cqw;letter-spacing:.03em}
.c.qrc{flex-direction:column;gap:.8cqw;padding-right:0}
.c.qrc .lab{font-weight:800;font-size:2.9cqw}
.qrcard{position:relative;width:14cqw;height:14cqw;background:#fff;border:.55cqw solid #d4a017;border-radius:2.2cqw;padding:1.1cqw}
.qrcard .qr,.qrcard .qr svg{width:100%;height:100%;display:block}
.qrcard .badge{position:absolute;inset:0;margin:auto;width:3.6cqw;height:3.6cqw;border-radius:50%;background:#fff;display:grid;place-items:center}
.qrcard .badge svg{width:2.8cqw;height:2.8cqw}
.dress{position:absolute;top:78.7%;left:50%;transform:translateX(-50%);width:48.3%;display:flex;align-items:center;justify-content:center;gap:2.4cqw;
 padding:1.3cqw 2.6cqw;background:#fff3dc;border:.6cqw solid #d4a017;border-radius:999px}
.dress:empty,.dress.off{display:none}
.dress svg{width:8.5cqw;height:8.5cqw;flex:none}
.dress small{display:block;font-weight:800;font-size:2.8cqw;letter-spacing:.02em}
.dress strong{display:block;font-family:Anton,'Arial Narrow',sans-serif;font-weight:400;font-size:4.9cqw;letter-spacing:.02em;line-height:1.05;text-transform:uppercase}

/* ===== controlos ===== */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.panel h2{margin:0;font-size:1rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}
label{display:grid;gap:4px;font-size:.8125rem;color:var(--muted);font-weight:600}
input[type=text],input[type=file]{min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font:inherit;font-size:.9375rem;width:100%}
button{min-height:44px;padding:0 16px;border-radius:12px;border:0;background:#1f6f66;color:#fff;font:inherit;font-weight:700;cursor:pointer}
button.sec{background:transparent;border:1px solid var(--line);color:var(--ink)}
:focus-visible{outline:3px solid #d4a017;outline-offset:2px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
@page{size:8in 10in;margin:0}
@media print{
 html,body{margin:0!important;padding:0!important;background:#fff!important}
 .wrap{max-width:none;margin:0;display:block;gap:0}
 .panel{display:none!important}
 .poster{width:100%!important;height:auto!important;aspect-ratio:4/5;border-radius:0;box-shadow:none;break-inside:avoid;page-break-inside:avoid}
}
</style>
</head>

        c.font=fontFor(size);m=c.measureText(txt);
        w=m.actualBoundingBoxLeft+m.actualBoundingBoxRight;
        h=m.actualBoundingBoxAscent+m.actualBoundingBoxDescent;
        if(w>0&&h>0&&w<=TITLE_BAND_WIDTH&&h<=TITLE_BAND_HEIGHT)break;
        size-=TITLE_FONT_STEP;
      }
      c.font=fontFor(size);m=c.measureText(txt);
      var left=m.actualBoundingBoxLeft,right=m.actualBoundingBoxRight,
          asc=m.actualBoundingBoxAscent,desc=m.actualBoundingBoxDescent;
      w=left+right;h=asc+desc;
      if(!w||!h)return;
      /* Mesma regra do PDF: scale = VIEWBOX_WIDTH / vw; manter dentro da faixa de 91%. */
      var vw=Math.max(TITLE_VIEWBOX_WIDTH,Math.ceil(w*TITLE_VIEWBOX_WIDTH/TITLE_BAND_WIDTH)+TITLE_PAD);
      el.setAttribute('font-size',String(size));
      el.setAttribute('x',String(left+(vw-w)/2));
      el.setAttribute('y',String((TITLE_VIEWBOX_HEIGHT-h)/2+asc));
      svg.setAttribute('viewBox','0 0 '+vw+' '+TITLE_VIEWBOX_HEIGHT);
      svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    };
    run();
    if(document.fonts&&document.fonts.load)document.fonts.load(TITLE_BASE_FONT_SIZE+'px Anton').then(run);
  }
  function qr(url){
    var h=$('#qr');
    try{var q=qrcode(0,'H');q.addData(url||' ');q.make();h.innerHTML=q.createSvgTag({cellSize:1,margin:0,scalable:true});}
    catch(e){h.textContent='QR';}
  }
  function apply(k,v){
    if(k==='title')return fitTitle(v);
    if(k==='qr')return qr(v);
    if(k==='dress'){var d=$('#dress');d.classList.toggle('off',!v.trim());$('#o-dress').textContent=v;return}
    if(k==='loc'){var e=$('#o-loc');e.textContent='';v.split('|').forEach(function(p,i){if(i)e.appendChild(document.createElement('br'));e.appendChild(document.createTextNode(p.trim()))});return}
    if(map[k])$(map[k]).textContent=v;
  }
  document.querySelectorAll('[data-f]').forEach(function(i){
    apply(i.dataset.f,i.value);
    i.addEventListener('input',function(){apply(i.dataset.f,i.value)});
  });
  $('#logoFile').addEventListener('change',function(e){
    var f=e.target.files[0]; if(!f)return;
    var r=new FileReader(); r.onload=function(){$('#logoImg').src=r.result;$('#logo').classList.add('has')}; r.readAsDataURL(f);
  });
  $('#print').addEventListener('click',function(){window.print()});
  $('#theme').addEventListener('click',function(){
    var r=document.documentElement,d=r.dataset.theme==='dark';
    r.dataset.theme=d?'light':'dark';
  });
})();
</script>
