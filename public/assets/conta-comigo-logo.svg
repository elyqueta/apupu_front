    <circle cx="74" cy="60" r="28" fill="#FFB627" clip-path="url(#ringA)"/>
    <circle cx="46" cy="60" r="28" fill="none" stroke="#0F3D3E" stroke-width="8"/>
    <circle cx="74" cy="60" r="28" fill="none" stroke="#0F3D3E" stroke-width="8"/>
    <path d="M53 61 L59 68 L70 53" fill="none" stroke="#0F3D3E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Nome -->
  <text x="130" y="73" font-family="Poppins, 'Segoe UI', 'Trebuchet MS', Arial, sans-serif" font-size="40" font-weight="600" letter-spacing="-0.6" fill="#0F3D3E">Conta Comigo</text>
